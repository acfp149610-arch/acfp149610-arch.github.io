<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração | Matemática com Zé Vitor</title>

    <link rel="stylesheet" href="admin.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header>
        <h1>Área Administrativa</h1>
        <p>Matemática com Zé Vitor</p>
    </header>

    <main>

        <section id="login">
            <h2>Entrar como administrador</h2>

            <input type="email" id="email" placeholder="Seu e-mail">

            <button onclick="entrar()">Entrar</button>

            <p id="mensagem"></p>
        </section>

        <section id="painel" style="display:none;">

            <div class="topo-painel">
                <h2>Contratações recebidas</h2>
                <button onclick="sair()">Sair</button>
            </div>

            <div class="resumo">
                <div>
                    <h3 id="total">0</h3>
                    <p>Total</p>
                </div>

                <div>
                    <h3 id="pendentes">0</h3>
                    <p>Pendentes</p>
                </div>

                <div>
                    <h3 id="confirmados">0</h3>
                    <p>Confirmados</p>
                </div>
            </div>

            <button onclick="carregarContratacoes()">Atualizar lista</button>

            <div id="listaContratacoes"></div>

        </section>

    </main>

    <script src="admin.js"></script>

</body>
</html>
window.entrar = entrar;
