<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Matemática com Zé Vitor</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #080808;
            color: #fff;
            min-height: 100vh;
        }

        .login-container {
            min-height: calc(100vh - 82px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
            background: #080808;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 12px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.4);
        }

        .login-card h1 {
            font-size: 30px;
            margin-bottom: 10px;
            color: #fff;
        }

        .login-card .subtitulo {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .login-card label {
            display: block;
            margin-bottom: 8px;
            color: #eee;
            font-size: 13px;
            font-weight: 600;
        }

        .login-card input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #0d0d0d;
            border: 1px solid #383838;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .login-card input:focus {
            border-color: #c82032;
        }

        .login-card button {
            width: 100%;
            padding: 15px;
            background: #c82032;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
            transition: .3s;
        }

        .login-card button:hover {
            background: #941323;
            transform: translateY(-2px);
        }

        .login-links {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 22px;
        }

        .login-links button {
            width: auto;
            padding: 0;
            background: transparent;
            color: #ccc;
            font-size: 12px;
            font-weight: 600;
        }

        .login-links button:hover {
            background: transparent;
            color: #c82032;
            transform: none;
        }

        #mensagem {
            margin-top: 18px;
            font-size: 13px;
            color: #ddd;
            text-align: center;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 28px 22px;
            }

            .login-card h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>MATEMÁTICA COM ZÉ VITOR</h2>

        <nav>
            <a href="index.html">INÍCIO</a>
            <a href="index.html#cursos">CURSOS</a>
            <a href="login.html">ENTRAR</a>
        </nav>
    </header>

    <main class="login-container">

        <section class="login-card">

            <h1>Bem-vindo!</h1>

            <p class="subtitulo">
                Entre na sua conta para acessar seus cursos.
            </p>

            <form id="formLogin">

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">ENTRAR NA CONTA</button>

            </form>

            <div class="login-links">

                <button type="button" id="cadastrar">
                    Criar conta
                </button>

                <button type="button" id="recuperar">
                    Esqueci minha senha
                </button>

            </div>

            <p id="mensagem"></p>

        </section>

    </main>

    <script type="module" src="login.js"></script>

</body>
</html>
