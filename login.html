<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Matemática com Zé Vitor</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background:
                radial-gradient(ellipse at center, #47121b 0%, #1a1012 45%, #101010 85%);
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: #1c1c1c;
            border: 1px solid #383838;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0,0,0,.4);
        }

        .login-box h1 {
            font-size: 25px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
        }

        .login-box .descricao {
            color: #aaa;
            font-size: 13px;
            text-align: center;
            margin-bottom: 30px;
        }

        .login-box h3 {
            font-size: 17px;
            margin-bottom: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: #292929;
            border: 1px solid #444;
            border-radius: 7px;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .login-box input:focus {
            border-color: #c82032;
        }

        .login-box button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 7px;
            background: #c82032;
            color: white;
            font-weight: 800;
            cursor: pointer;
            transition: .3s;
        }

        .login-box button:hover {
            background: #941323;
        }

        .login-box .secundario {
            background: #303030;
            border: 1px solid #444;
        }

        .login-box .secundario:hover {
            background: #444;
        }

        #mensagem {
            color: #ff6474;
            font-size: 13px;
            text-align: center;
            margin-top: 20px;
            line-height: 1.6;
        }

        .voltar {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #aaa;
            font-size: 12px;
            text-decoration: none;
        }

        .voltar:hover {
            color: #c82032;
        }

        @media(max-width: 480px) {
            .login-box {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>MATEMÁTICA COM ZÉ VITOR</h2>
        <nav>
            <a href="index.html">INÍCIO</a>
            <a href="index.html#cursos">CURSOS</a>
        </nav>
    </header>

    <main class="login-container">

        <div class="login-box">

            <h1>SEJA BEM-VINDO!</h1>

            <p class="descricao">
                Acesse sua conta e continue sua jornada na Matemática.
            </p>

            <h3>Entrar na sua conta</h3>

            <form id="formLogin">

                <input
                    type="email"
                    id="email"
                    placeholder="Seu e-mail"
                    required
                >

                <input
                    type="password"
                    id="senha"
                    placeholder="Sua senha"
                    required
                >

                <button type="submit">ENTRAR</button>

            </form>

            <button class="secundario" id="cadastrar">
                CRIAR MINHA CONTA
            </button>

            <button class="secundario" id="recuperar">
                ESQUECI MINHA SENHA
            </button>

            <p id="mensagem"></p>

            <a href="index.html" class="voltar">
                VOLTAR PARA A PÁGINA INICIAL
            </a>

        </div>

    </main>

    <script type="module" src="login.js"></script>

</body>
</html>
