<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Matemática com Zé Vitor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
        }

        .caixa {
            width: 100%;
            max-width: 400px;
            background: #202020;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            font-size: 23px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #555;
            border-radius: 7px;
            background: #333;
            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 7px;
            background: #b51220;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .secundario {
            background: #444;
        }

        #mensagem {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="caixa">

    <h1>MATEMÁTICA COM ZÉ VITOR</h1>

    <h3>Entre na sua conta</h3>

    <form id="formLogin">
        <input
            type="email"
            id="email"
            placeholder="Seu e-mail"
            required
        >

        <input
            type="password"
            id="senha"
            placeholder="Sua senha"
            required
        >

        <button type="submit">ENTRAR</button>
    </form>

    <button class="secundario" id="cadastrar">
        CRIAR CONTA
    </button>

    <button class="secundario" id="recuperar">
        ESQUECI MINHA SENHA
    </button>

    <p id="mensagem"></p>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
